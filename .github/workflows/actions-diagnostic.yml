name: Actions diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Android build workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/android-debug.yml"); puts "YAML syntax OK"'
