name: Actions diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show YAML error context
        run: |
          nl -ba .github/workflows/android-debug.yml | sed -n '220,238p'
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/android-debug.yml")'
