name: Build ShuzaGram Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout ShuzaGram source
        uses: actions/checkout@v4
        with:
          repository: shuzq-sh/shuzagram-mod
          ref: main
          path: build-source
          fetch-depth: 1

      - name: Fetch declared source dependencies
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser
          import pathlib
          import subprocess

          config = configparser.ConfigParser()
          config.read(".gitmodules")
          for section in config.sections():
              path = config[section]["path"]
              url = config[section]["url"]
              if not (pathlib.Path(path) / ".git").exists():
                  pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
                  print(f"Cloning {path} from {url}", flush=True)
                  subprocess.run(["git", "clone", "--depth", "1", url, path], check=True)
              if path == "TMessagesProj/jni/tgcalls":
                  # Pin the last tgcalls revision that contains every source
                  # referenced by this ShuzaGram revision's VoIP CMakeLists.
                  tgcalls_commit = "5f1c70c59003f41f9f579277cb5a7d61061a0de7"
                  subprocess.run(["git", "-C", path, "fetch", "--depth", "1", "origin", tgcalls_commit], check=True)
                  subprocess.run(["git", "-C", path, "checkout", "--detach", "FETCH_HEAD"], check=True)
              subprocess.run(["git", "-C", path, "submodule", "update", "--init", "--recursive"], check=True)

          media = pathlib.Path("TMessagesProj_Modules/media")
          if not (media / "core_settings.gradle").exists():
              if media.exists():
                  import shutil
                  shutil.rmtree(media)
              media.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "clone", "--depth", "1", "https://github.com/TomFamily/androidX-media.git", str(media)], check=True)
              subprocess.run(["git", "-C", str(media), "submodule", "update", "--init", "--recursive"], check=True)

          # The upstream Media3 common module must use full Gradle project paths
          # when Media3 is included under a nested project prefix.
          common_build = media / "libraries/common/build.gradle"
          common_source = common_build.read_text()
          old = "implementation project(':' + it.name)"
          new = "implementation project(it.path)"
          if old in common_source:
              common_build.write_text(common_source.replace(old, new))
          elif new not in common_source:
              raise SystemExit("Could not apply nested Media3 project-path compatibility fix")

          # This WebRTC snapshot uses the older absl::Nonnull<T> spelling,
          # while current Abseil exposes nullability macros instead.
          nullability = pathlib.Path("TMessagesProj/jni/third_party/absl/absl/base/nullability.h")
          nullability_source = nullability.read_text()
          compatibility_alias = "namespace absl {\n  template <typename T> using Nonnull = T;\n  template <typename T> using Nullable = T;\n}\n"
          if "using Nonnull =" not in nullability_source:
              marker = "#endif  // ABSL_BASE_NULLABILITY_H_"
              if marker not in nullability_source:
                  raise SystemExit("Could not locate Abseil nullability header insertion point")
              nullability.write_text(nullability_source.replace(marker, compatibility_alias + marker, 1))

          # WebRTC places ABSL_DEPRECATED after the return type. The modern
          # C++ [[deprecated]] attribute is not valid in that position;
          # use the GNU attribute spelling accepted by Clang there.
          attributes = pathlib.Path("TMessagesProj/jni/third_party/absl/absl/base/attributes.h")
          attributes_source = attributes.read_text()
          modern = "#define ABSL_DEPRECATED(message) [[deprecated(message)]]"
          compatible = "#define ABSL_DEPRECATED(message) __attribute__((deprecated(message)))"
          if modern in attributes_source:
              attributes.write_text(attributes_source.replace(modern, compatible, 1))
          elif compatible not in attributes_source:
              raise SystemExit("Could not locate Abseil ABSL_DEPRECATED definition")
          # Align this tgcalls Android adapter with the PlatformInterface API
          # shipped in the pinned source revision.
          root = pathlib.Path("TMessagesProj/jni/tgcalls/tgcalls/platform/android")
          def replace_once(path, old_text, new_text):
              p = root / path
              source = p.read_text()
              if new_text in source:
                  return
              if old_text not in source:
                  raise SystemExit(f"Could not patch tgcalls Android API in {p}")
              p.write_text(source.replace(old_text, new_text, 1))

          replace_once("AndroidInterface.h",
              "void configurePlatformAudio() override;",
              "void configurePlatformAudio(int numChannels = 1) override;")
          replace_once("AndroidInterface.h",
              "std::unique_ptr<webrtc::VideoEncoderFactory> makeVideoEncoderFactory() override;",
              "std::unique_ptr<webrtc::VideoEncoderFactory> makeVideoEncoderFactory(bool preferHardwareEncoding = false, bool isScreencast = false) override;")
          replace_once("AndroidInterface.h",
              "std::function<void(VideoState)> stateUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) override;",
              "std::function<void(VideoState)> stateUpdated, std::function<void(PlatformCaptureInfo)> captureInfoUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) override;")
          replace_once("AndroidInterface.cpp",
              '#include "api/video_track_source_proxy.h"\n', "")
          replace_once("AndroidInterface.cpp",
              "void AndroidInterface::configurePlatformAudio() {",
              "void AndroidInterface::configurePlatformAudio(int numChannels) {")
          replace_once("AndroidInterface.cpp",
              "std::unique_ptr<webrtc::VideoEncoderFactory> AndroidInterface::makeVideoEncoderFactory() {",
              "std::unique_ptr<webrtc::VideoEncoderFactory> AndroidInterface::makeVideoEncoderFactory(bool preferHardwareEncoding, bool isScreencast) {")
          replace_once("AndroidInterface.cpp",
              "return webrtc::VideoTrackSourceProxy::Create(signalingThread, workerThread, _source);",
              "return _source;")
          replace_once("AndroidInterface.cpp",
              "std::function<void(VideoState)> stateUpdated, std::shared_ptr<PlatformContext> platformContext) {",
              "std::function<void(VideoState)> stateUpdated, std::function<void(PlatformCaptureInfo)> captureInfoUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) {")
          impl_h = root / "VideoCapturerInterfaceImpl.h"
          impl_source = impl_h.read_text()
          if "int getRotation() override;" not in impl_source:
              marker = "\tvoid setState(VideoState state) override;"
              if marker not in impl_source:
                  raise SystemExit("Could not add getRotation to Android capturer interface")
              impl_h.write_text(impl_source.replace(marker, marker + "\n\tint getRotation() override;", 1))
          impl_cpp = root / "VideoCapturerInterfaceImpl.cpp"
          impl_source = impl_cpp.read_text()
          if "VideoCapturerInterfaceImpl::getRotation()" not in impl_source:
              marker = "void VideoCapturerInterfaceImpl::setState(VideoState state) {"
              if marker not in impl_source:
                  raise SystemExit("Could not add getRotation implementation")
              impl_source = impl_source.replace(marker, "int VideoCapturerInterfaceImpl::getRotation() {\n\treturn 0;\n}\n\n" + marker, 1)
              impl_cpp.write_text(impl_source)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure Telegram API credentials
        working-directory: build-source
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not api_id or not api_hash or not api_id.isdigit():
              raise SystemExit("Check TELEGRAM_API_ID and TELEGRAM_API_HASH GitHub Actions secrets")
          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text()
          source, n1 = re.subn(r"public static int APP_ID = 0;", f"public static int APP_ID = {api_id};", source, count=1)
          source, n2 = re.subn(r'public static String APP_HASH = "";', f'public static String APP_HASH = "{api_hash}";', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely locate APP_ID / APP_HASH in BuildVars.java")
          path.write_text(source)
          PY

      - name: Prepare temporary signing key
        working-directory: build-source
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ShuzaGram Debug, OU=CI, O=ShuzaGram, L=Unknown, ST=Unknown, C=US"

      - name: Skip Google Services config for test build
        working-directory: build-source
        run: |
          sed -i "s/^apply plugin: 'com.google.gms.google-services'/\/\/ Google Services disabled for CI test build (no google-services.json)/" TMessagesProj_App/build.gradle
          sed -i "s/^apply plugin: 'com.google.gms.google-services'/\/\/ Google Services disabled for CI test build (no google-services.json)/" TMessagesProj/build.gradle

      - name: Build universal Debug APK
        working-directory: build-source
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShuzaGram-debug
          path: build-source/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
