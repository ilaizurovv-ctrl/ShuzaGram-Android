name: Build ShuzaGram Debug APK
run-name: ShuzaGram APK build #${{ github.run_number }}

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout ShuzaGram source
        uses: actions/checkout@v4
        with:
          repository: shuzq-sh/shuzagram-mod
          ref: main
          path: build-source
          fetch-depth: 1

      - name: Fetch declared source dependencies
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser
          import pathlib
          import subprocess

          config = configparser.ConfigParser()
          config.read(".gitmodules")
          for section in config.sections():
              path = config[section]["path"]
              url = config[section]["url"]
              if not (pathlib.Path(path) / ".git").exists():
                  pathlib.Path(path).parent.mkdir(parents=True, exist_ok=True)
                  print(f"Cloning {path} from {url}", flush=True)
                  subprocess.run(["git", "clone", "--depth", "1", url, path], check=True)
              if path == "TMessagesProj/jni/tgcalls":
                  # Pin the last tgcalls revision that contains every source
                  # referenced by this ShuzaGram revision's VoIP CMakeLists.
                  tgcalls_commit = "5f1c70c59003f41f9f579277cb5a7d61061a0de7"
                  subprocess.run(["git", "-C", path, "fetch", "--depth", "1", "origin", tgcalls_commit], check=True)
                  subprocess.run(["git", "-C", path, "checkout", "--detach", "FETCH_HEAD"], check=True)
              subprocess.run(["git", "-C", path, "submodule", "update", "--init", "--recursive"], check=True)

          media = pathlib.Path("TMessagesProj_Modules/media")
          if not (media / "core_settings.gradle").exists():
              if media.exists():
                  import shutil
                  shutil.rmtree(media)
              media.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "clone", "--depth", "1", "https://github.com/TomFamily/androidX-media.git", str(media)], check=True)
              subprocess.run(["git", "-C", str(media), "submodule", "update", "--init", "--recursive"], check=True)

          # The upstream Media3 common module must use full Gradle project paths
          # when Media3 is included under a nested project prefix.
          common_build = media / "libraries/common/build.gradle"
          common_source = common_build.read_text()
          old = "implementation project(':' + it.name)"
          new = "implementation project(it.path)"
          if old in common_source:
              common_build.write_text(common_source.replace(old, new))
          elif new not in common_source:
              raise SystemExit("Could not apply nested Media3 project-path compatibility fix")

          # This WebRTC snapshot uses the older absl::Nonnull<T> spelling,
          # while current Abseil exposes nullability macros instead.
          nullability = pathlib.Path("TMessagesProj/jni/third_party/absl/absl/base/nullability.h")
          nullability_source = nullability.read_text()
          compatibility_alias = "namespace absl {\n  template <typename T> using Nonnull = T;\n  template <typename T> using Nullable = T;\n}\n"
          if "using Nonnull =" not in nullability_source:
              marker = "#endif  // ABSL_BASE_NULLABILITY_H_"
              if marker not in nullability_source:
                  raise SystemExit("Could not locate Abseil nullability header insertion point")
              nullability.write_text(nullability_source.replace(marker, compatibility_alias + marker, 1))

          # WebRTC places ABSL_DEPRECATED after the return type. The modern
          # C++ [[deprecated]] attribute is not valid in that position;
          # use the GNU attribute spelling accepted by Clang there.
          attributes = pathlib.Path("TMessagesProj/jni/third_party/absl/absl/base/attributes.h")
          attributes_source = attributes.read_text()
          modern = "#define ABSL_DEPRECATED(message) [[deprecated(message)]]"
          compatible = "#define ABSL_DEPRECATED(message) __attribute__((deprecated(message)))"
          if modern in attributes_source:
              attributes.write_text(attributes_source.replace(modern, compatible, 1))
          elif compatible not in attributes_source:
              raise SystemExit("Could not locate Abseil ABSL_DEPRECATED definition")

          # Rebuild Prisma's C++ core from the checked-out source. The bundled
          # libprisma.a does not export the tokenize() overload used by this bridge.
          native_cmake = pathlib.Path("TMessagesProj/jni/CMakeLists.txt")
          native_source = native_cmake.read_text()
          import re
          prisma_pattern = (
              r"add_library\(prisma\s+STATIC\s+IMPORTED\)\s*"
              r"set_target_properties\(prisma\s+PROPERTIES\s+"
              r"IMPORTED_LOCATION\s+\$\{CMAKE_HOME_DIRECTORY\}/prebuild/lib/"
              r"\$\{ANDROID_ABI\}/libprisma\.a\)"
          )
          native_source, prisma_matches = re.subn(
              prisma_pattern, "add_subdirectory(prisma)", native_source, count=1
          )
          if prisma_matches == 1:
              native_cmake.write_text(native_source)
          elif "add_subdirectory(prisma)" not in native_source:
              raise SystemExit("Could not switch Prisma from the stale prebuilt archive to source")

          # The local Prisma Highlight.h/.cpp files are also from an older API:
          # they lack Pattern::search(), which the current upstream SyntaxHighlighter uses.
          # Use the complete, version-matched upstream libprisma source set.
          prisma_cmake = pathlib.Path("TMessagesProj/jni/prisma/CMakeLists.txt")
          prisma_cmake_source = prisma_cmake.read_text()
          old_overrides = """foreach(source IN ITEMS Highlight.cpp Highlight.h SyntaxHighlighter.cpp)
              configure_file("${CMAKE_CURRENT_SOURCE_DIR}/libprisma/${source}"
                  "${PRISMA_CORE_DIR}/${source}" COPYONLY)
          endforeach()"""
          if old_overrides in prisma_cmake_source:
              prisma_cmake.write_text(prisma_cmake_source.replace(old_overrides, "# Local Prisma overrides disabled: use version-matched upstream sources.", 1))
          elif "# Local Prisma overrides disabled: use version-matched upstream sources." not in prisma_cmake_source:
              raise SystemExit("Could not disable incompatible local Prisma source overrides")
          # Guard against stale CMake copies from a previous configure in the same workspace.
          generated_prisma = pathlib.Path("TMessagesProj/.cxx")
          if generated_prisma.exists():
              import shutil
              shutil.rmtree(generated_prisma)

          # The pinned tgcalls expects CRYPTO_BUFFER_dup_ref, whereas this
          # project's prebuilt BoringSSL archive exports CRYPTO_BUFFER_up_ref.
          # Provide the newer reference-taking API as a small ABI-compatible shim.
          boringssl_compat = pathlib.Path("TMessagesProj/jni/boringssl_compat.cpp")
          boringssl_compat.write_text("""#include <openssl/pool.h>

          extern "C" CRYPTO_BUFFER *CRYPTO_BUFFER_dup_ref(const CRYPTO_BUFFER *buffer) {
              if (buffer == nullptr) return nullptr;
              auto *mutableBuffer = const_cast<CRYPTO_BUFFER *>(buffer);
              if (!CRYPTO_BUFFER_up_ref(mutableBuffer)) return nullptr;
              return mutableBuffer;
          }
          """)

          bridge_marker = '        "${CMAKE_CURRENT_SOURCE_DIR}/prisma/bridge/PrismaJni.cpp")'
          bridge_replacement = '        "${CMAKE_CURRENT_SOURCE_DIR}/prisma/bridge/PrismaJni.cpp"\n        "${CMAKE_CURRENT_SOURCE_DIR}/boringssl_compat.cpp")'
          if bridge_marker in native_source:
              native_source = native_source.replace(bridge_marker, bridge_replacement, 1)
              native_cmake.write_text(native_source)
          elif "boringssl_compat.cpp" not in native_source:
              raise SystemExit("Could not add BoringSSL compatibility shim to native target")
          # Align this tgcalls Android adapter with the PlatformInterface API
          # shipped in the pinned source revision.
          root = pathlib.Path("TMessagesProj/jni/tgcalls/tgcalls/platform/android")
          def replace_once(path, old_text, new_text):
              p = root / path
              source = p.read_text()
              if new_text and new_text in source:
                  return
              if old_text not in source:
                  raise SystemExit(f"Could not patch tgcalls Android API in {p}")
              p.write_text(source.replace(old_text, new_text, 1))

          replace_once("AndroidInterface.h",
              "void configurePlatformAudio() override;",
              "void configurePlatformAudio(int numChannels = 1) override;")
          replace_once("AndroidInterface.h",
              "std::unique_ptr<webrtc::VideoEncoderFactory> makeVideoEncoderFactory() override;",
              "std::unique_ptr<webrtc::VideoEncoderFactory> makeVideoEncoderFactory(bool preferHardwareEncoding = false, bool isScreencast = false) override;")
          replace_once("AndroidInterface.h",
              "std::function<void(VideoState)> stateUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) override;",
              "std::function<void(VideoState)> stateUpdated, std::function<void(PlatformCaptureInfo)> captureInfoUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) override;")
          replace_once("AndroidInterface.cpp",
              '#include "api/video_track_source_proxy.h"\n', "")
          replace_once("AndroidInterface.cpp",
              "void AndroidInterface::configurePlatformAudio() {",
              "void AndroidInterface::configurePlatformAudio(int numChannels) {")
          replace_once("AndroidInterface.cpp",
              "std::unique_ptr<webrtc::VideoEncoderFactory> AndroidInterface::makeVideoEncoderFactory() {",
              "std::unique_ptr<webrtc::VideoEncoderFactory> AndroidInterface::makeVideoEncoderFactory(bool preferHardwareEncoding, bool isScreencast) {")
          replace_once("AndroidInterface.cpp",
              "return webrtc::VideoTrackSourceProxy::Create(signalingThread, workerThread, _source);",
              "return _source;")
          # Restore the AndroidContext bridge expected by this app's JNI layer.
          # The pinned upstream tgcalls revision has a newer, minimal context.
          context_h = root / "AndroidContext.h"
          context_source = context_h.read_text()
          if '#include "tgcalls/group/GroupInstanceImpl.h"' not in context_source:
              context_source = context_source.replace(
                  '#include "PlatformContext.h"',
                  '#include "PlatformContext.h"\n#include "tgcalls/group/GroupInstanceImpl.h"', 1)
          if "AndroidContext(JNIEnv *env, jobject peerInstance, jobject groupInstance, bool screencast);" not in context_source:
              context_source = context_source.replace(
                  "    AndroidContext(JNIEnv *env);",
                  "    AndroidContext(JNIEnv *env);\n    AndroidContext(JNIEnv *env, jobject peerInstance, jobject groupInstance, bool screencast);", 1)
          declarations = """
              jobject getJavaInstance();
              jobject getJavaPeerInstance();
              jobject getJavaGroupInstance();
              void setJavaPeerInstance(JNIEnv *env, jobject instance);
              void setJavaGroupInstance(JNIEnv *env, jobject instance);
              std::vector<std::shared_ptr<BroadcastPartTask>> audioStreamTasks;
              std::vector<std::shared_ptr<BroadcastPartTask>> videoStreamTasks;
              std::vector<std::shared_ptr<RequestMediaChannelDescriptionTask>> descriptionTasks;
          """
          if "getJavaPeerInstance()" not in context_source:
              context_source = context_source.replace(
                  "    jclass getJavaCapturerClass();",
                  "    jclass getJavaCapturerClass();\n" + declarations, 1)
          fields = """
              jobject javaPeerInstance = nullptr;
              jobject javaGroupInstance = nullptr;
          """
          if "javaPeerInstance = nullptr" not in context_source:
              context_source = context_source.replace(
                  "    jobject javaCapturer = nullptr;",
                  "    jobject javaCapturer = nullptr;\n" + fields, 1)
          context_h.write_text(context_source)

          context_cpp = root / "AndroidContext.cpp"
          cpp_source = context_cpp.read_text()
          constructor_marker = "AndroidContext::~AndroidContext() {"
          if "AndroidContext::AndroidContext(JNIEnv *env, jobject peerInstance" not in cpp_source:
              if constructor_marker not in cpp_source:
                  raise SystemExit("Could not locate AndroidContext constructor insertion point")
              overload = """AndroidContext::AndroidContext(JNIEnv *env, jobject peerInstance, jobject groupInstance, bool screencast)
              : AndroidContext(env) {
              (void) screencast;
              if (peerInstance) javaPeerInstance = env->NewGlobalRef(peerInstance);
              if (groupInstance) javaGroupInstance = env->NewGlobalRef(groupInstance);
          }

          """
              cpp_source = cpp_source.replace(constructor_marker, overload + constructor_marker, 1)
          cleanup_marker = "    env->DeleteGlobalRef(VideoCameraCapturerClass);"
          if "env->DeleteGlobalRef(javaPeerInstance)" not in cpp_source:
              if cleanup_marker not in cpp_source:
                  raise SystemExit("Could not locate AndroidContext cleanup insertion point")
              cpp_source = cpp_source.replace(cleanup_marker, cleanup_marker + """
              if (javaPeerInstance) env->DeleteGlobalRef(javaPeerInstance);
              if (javaGroupInstance) env->DeleteGlobalRef(javaGroupInstance);
          """, 1)
          if "AndroidContext::getJavaPeerInstance()" not in cpp_source:
              end_marker = "jclass AndroidContext::getJavaCapturerClass() {"
              if end_marker not in cpp_source:
                  raise SystemExit("Could not locate AndroidContext accessor insertion point")
              accessors = """jobject AndroidContext::getJavaInstance() {
              return javaPeerInstance ? javaPeerInstance : javaGroupInstance;
          }

          jobject AndroidContext::getJavaPeerInstance() {
              return javaPeerInstance;
          }

          jobject AndroidContext::getJavaGroupInstance() {
              return javaGroupInstance;
          }

          void AndroidContext::setJavaPeerInstance(JNIEnv *env, jobject instance) {
              if (javaPeerInstance) env->DeleteGlobalRef(javaPeerInstance);
              javaPeerInstance = instance ? env->NewGlobalRef(instance) : nullptr;
          }

          void AndroidContext::setJavaGroupInstance(JNIEnv *env, jobject instance) {
              if (javaGroupInstance) env->DeleteGlobalRef(javaGroupInstance);
              javaGroupInstance = instance ? env->NewGlobalRef(instance) : nullptr;
          }

          """
              cpp_source = cpp_source.replace(end_marker, accessors + end_marker, 1)
          context_cpp.write_text(cpp_source)

          # The pinned tgcalls Peer Descriptor reports one audio level,
          # while this app's JNI callback still accepts the legacy two-value array.
          voip_jni = pathlib.Path("TMessagesProj/jni/voip/org_telegram_messenger_voip_Instance.cpp")
          voip_source = voip_jni.read_text()
          old_header = ".audioLevelsUpdated = [platformContext](float myAudioLevel, float audioLevel) {"
          new_header = ".audioLevelUpdated = [platformContext](float audioLevel) {"
          old_capture = "[platformContext, myAudioLevel, audioLevel](JNIEnv *env)"
          new_capture = "[platformContext, audioLevel](JNIEnv *env)"
          if old_header in voip_source:
              voip_source = voip_source.replace(old_header, new_header, 1)
              if old_capture not in voip_source:
                  raise SystemExit("Could not locate legacy JNI audio callback capture")
              voip_source = voip_source.replace(old_capture, new_capture, 1)
              if "floatFill[0] = myAudioLevel;" not in voip_source or "floatFill[1] = audioLevel;" not in voip_source:
                  raise SystemExit("Could not locate legacy JNI audio level values")
              voip_source = voip_source.replace("floatFill[0] = myAudioLevel;", "floatFill[0] = audioLevel;", 1)
              voip_source = voip_source.replace("floatFill[1] = audioLevel;", "floatFill[1] = 0.0f;", 1)
              voip_jni.write_text(voip_source)
          elif new_header not in voip_source:
              raise SystemExit("Could not adapt legacy JNI audio-level callback to pinned tgcalls API")
          replace_once("AndroidInterface.cpp",
              "std::function<void(VideoState)> stateUpdated, std::shared_ptr<PlatformContext> platformContext) {",
              "std::function<void(VideoState)> stateUpdated, std::function<void(PlatformCaptureInfo)> captureInfoUpdated, std::shared_ptr<PlatformContext> platformContext, std::pair<int, int> &outResolution) {")
          impl_h = root / "VideoCapturerInterfaceImpl.h"
          impl_source = impl_h.read_text()
          if "int getRotation() override;" not in impl_source:
              marker = "\tvoid setState(VideoState state) override;"
              if marker not in impl_source:
                  raise SystemExit("Could not add getRotation to Android capturer interface")
              impl_h.write_text(impl_source.replace(marker, marker + "\n\tint getRotation() override;", 1))
          impl_cpp = root / "VideoCapturerInterfaceImpl.cpp"
          impl_source = impl_cpp.read_text()
          if "VideoCapturerInterfaceImpl::getRotation()" not in impl_source:
              marker = "void VideoCapturerInterfaceImpl::setState(VideoState state) {"
              if marker not in impl_source:
                  raise SystemExit("Could not add getRotation implementation")
              impl_source = impl_source.replace(marker, "int VideoCapturerInterfaceImpl::getRotation() {\n\treturn 0;\n}\n\n" + marker, 1)
              impl_cpp.write_text(impl_source)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure Telegram API credentials
        working-directory: build-source
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          api_id = os.environ.get("TELEGRAM_API_ID", "").strip()
          api_hash = os.environ.get("TELEGRAM_API_HASH", "").strip()
          if not api_id or not api_hash or not api_id.isdigit():
              raise SystemExit("Check TELEGRAM_API_ID and TELEGRAM_API_HASH GitHub Actions secrets")
          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text()
          source, n1 = re.subn(r"public static int APP_ID = 0;", f"public static int APP_ID = {api_id};", source, count=1)
          source, n2 = re.subn(r'public static String APP_HASH = "";', f'public static String APP_HASH = "{api_hash}";', source, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely locate APP_ID / APP_HASH in BuildVars.java")
          path.write_text(source)
          PY

      - name: Prepare temporary signing key
        working-directory: build-source
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -storepass android -keypass android -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ShuzaGram Debug, OU=CI, O=ShuzaGram, L=Unknown, ST=Unknown, C=US"

      - name: Skip Google Services config for test build
        working-directory: build-source
        run: |
          sed -i "s/^apply plugin: 'com.google.gms.google-services'/\/\/ Google Services disabled for CI test build (no google-services.json)/" TMessagesProj_App/build.gradle
          sed -i "s/^apply plugin: 'com.google.gms.google-services'/\/\/ Google Services disabled for CI test build (no google-services.json)/" TMessagesProj/build.gradle

      - name: Build universal Debug APK
        working-directory: build-source
        run: ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShuzaGram-debug
          path: build-source/TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          if-no-files-found: error
          retention-days: 14
